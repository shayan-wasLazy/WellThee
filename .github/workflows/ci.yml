name: WealthOS CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and local-stack test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          BACKEND_URL: 'http://localhost:8000'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest -q
        working-directory: backend
        env:
          DATABASE_URL: 'sqlite+pysqlite:///:memory:'
          JWT_SECRET: 'ci-only-test-secret'
          FRONTEND_ORIGINS: 'http://localhost:3000'
          ENVIRONMENT: 'test'

      - name: Build and start the local Docker Compose stack
        run: docker compose up --build -d

      - name: Wait for local frontend and backend readiness
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3000/health >/dev/null \
              && curl --fail --silent http://localhost:3000/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          curl --fail --silent http://localhost:3000/ >/dev/null
          echo "Local frontend and PostgreSQL-backed API are ready."

      - name: Exercise local registration, persistence, budgets, goals and LangGraph through the frontend proxy
        run: python scripts/smoke_local.py

      - name: Stop local containers and remove the ephemeral test database
        if: always()
        run: docker compose down --volumes --remove-orphans
